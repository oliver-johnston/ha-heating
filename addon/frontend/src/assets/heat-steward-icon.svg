  </defs>

  <!--
    Clean vector reconstruction of the original cutout mark.
    Both the shield and the H crossbar are centred at x=70. The second contour
    is the transparent radiator-shaped H and uses even-odd filling to punch it
    cleanly out of the shield.
  -->
