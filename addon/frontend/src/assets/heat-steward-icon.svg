<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 160" role="img" aria-labelledby="title description">
  <title id="title">Heat Steward</title>
  <desc id="description">A radiator-shaped H cut out of a purple shield.</desc>

  <defs>
    <linearGradient id="shield-gradient" x1="12%" y1="8%" x2="88%" y2="94%">
