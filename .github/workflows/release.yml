name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

env:
  ARCHITECTURES: '["amd64", "aarch64"]'
  IMAGE_NAME: heat-steward

jobs:
  quality:
    name: Run release checks
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  prepare:
    name: Validate release
    needs: quality
    runs-on: ubuntu-24.04
    outputs:
      image_tags: ${{ steps.version.outputs.image_tags }}
      matrix: ${{ steps.matrix.outputs.matrix }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read and verify version
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          python scripts/check_versions.py "${version}"
          python scripts/release_metadata.py "${RELEASE_TAG}" --github-output >> "$GITHUB_OUTPUT"
      - name: Prepare build matrix
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@7412f0023ea9b6e58e8bb5059f1660f51376f49a # 2026.09.0
        with:
          architectures: ${{ env.ARCHITECTURES }}
          image-name: ${{ env.IMAGE_NAME }}

  build:
    name: Publish ${{ matrix.arch }} image
    needs: prepare
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build, sign, and publish image
        uses: home-assistant/builder/actions/build-image@7412f0023ea9b6e58e8bb5059f1660f51376f49a # 2026.09.0
        with:
          arch: ${{ matrix.arch }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          context: ./addon
          image: ${{ matrix.image }}
          image-tags: ${{ needs.prepare.outputs.image_tags }}
          labels: |
            io.hass.type=app
            io.hass.name=Heat Steward
            io.hass.description=Reliable room-by-room heating and hot-water control for SONOFF TRVZB systems
            io.hass.url=https://github.com/oliver-johnston/heat-steward
          push: "true"
          skip-existing: ${{ needs.prepare.outputs.version }}
          version: ${{ needs.prepare.outputs.version }}

  manifest:
    name: Publish multi-architecture image
    needs:
      - prepare
      - build
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      packages: write
    steps:
      - name: Publish and sign manifest
        uses: home-assistant/builder/actions/publish-multi-arch-manifest@7412f0023ea9b6e58e8bb5059f1660f51376f49a # 2026.09.0
        with:
          architectures: ${{ env.ARCHITECTURES }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image-name: ${{ env.IMAGE_NAME }}
          image-tags: ${{ needs.prepare.outputs.image_tags }}

  github-release:
    name: Create GitHub release
    needs:
      - prepare
      - manifest
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          release_args=(
            "${RELEASE_TAG}"
            --repo "${GITHUB_REPOSITORY}"
            --title "Heat Steward ${VERSION}"
            --generate-notes
            --verify-tag
          )
          if [[ "${PRERELEASE}" == "true" ]]; then
            release_args+=(--prerelease)
          else
            release_args+=(--latest)
          fi
          gh release create "${release_args[@]}"
